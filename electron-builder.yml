appId: local.omp.desktop
productName: OMP-Desktop
asar: true
npmRebuild: false
forceCodeSigning: false
directories:
  output: release
files:
  - out/**/*
  - package.json
  - LICENSE
  - THIRD_PARTY_NOTICES.md
  - licenses/**/*
extraResources:
  - from: resources/omp-desktop-presence.ts
    to: omp-desktop-presence.ts
mac:
  target:
    - target: dmg
      arch:
        - arm64
  artifactName: OMP-Desktop-${version}-mac-${arch}.${ext}
  icon: build/icon.icns
  identity: null
  category: public.app-category.developer-tools
  hardenedRuntime: false
  notarize: false
win:
  signAndEditExecutable: false
linux:
  category: Development
